repos:
  - repo: https://github.com/psf/black
    rev: 24.4.2
    hooks:
      - id: black
        language_version: python3
        # (optional) Black uses 88 by default; keep it aligned with flake8's max line length if you change it

  - repo: https://github.com/PyCQA/isort
    rev: 5.13.2
    hooks:
      - id: isort

  - repo: https://github.com/pycqa/flake8
    rev: 7.1.0
    hooks:
      - id: flake8
        args:
          - --max-line-length=119
          - --exclude=venv,.venv,*/migrations/*  # skip migrations
          - --per-file-ignores=
            accounts/admin.py:F401,
            orders/admin.py:F401,
            */tests.py:F401

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: end-of-file-fixer
      - id: trailing-whitespace
